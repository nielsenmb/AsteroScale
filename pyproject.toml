[project]
name = "AsteroScale"
version = "0.2.0"
description = "Marginalizing solver for asteroseismic scaling relations"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "dynesty",
    "matplotlib",
    "baldr[numpy] @ git+https://github.com/nielsenmb/Baldr.git@476f59ff4114226488f9e155c83593a725f0f232",
]

[project.optional-dependencies]
test = ["pytest>=7", "jax>=0.4.28"]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme>=0.15",
    "myst-nb>=1.1",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]

[project.scripts]
asteroscale-train-prior = "asteroscale.training.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
asteroscale = [
    "data/*.npz",
    "data/*.md",
    "data/population_models/*.npz",
    "data/population_models/*.json",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
